<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ShadowDrive</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #080606; }
    #ui { position: fixed; left: 0; top: 0; padding: 10px 12px; color: #f0e6da;
          font: 13px/1.5 system-ui, sans-serif; z-index: 10;
          display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #ui button { font: 13px system-ui; padding: 5px 12px; cursor: pointer;
                 background: rgba(40,30,24,0.7); color: #ffd9a0;
                 border: 1px solid rgba(255,178,77,0.4); border-radius: 5px; }
    #ui button:hover { background: rgba(60,44,34,0.9); }
    #ui button.active { background: rgba(255,178,77,0.28); border-color: rgba(255,178,77,0.8); color: #fff0d8; }
    #levelLabel { font-weight: 600; color: #ffd9a0; }
    #stageTimer { position: fixed; top: 7px; left: 50%; transform: translateX(-50%); z-index: 20;
                  display: none; font: 600 13px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums;
                  color: #ffd9a0; background: rgba(22,16,12,0.55); padding: 3px 10px; border-radius: 10px;
                  letter-spacing: 0.5px; pointer-events: none; }
    #stageTimer.danger { color: #ff6f5e; background: rgba(60,18,14,0.6); }
    #phase { font-weight: 700; letter-spacing: 0.5px; color: #ffd9a0; }
    #hint { color: #b8a890; opacity: 0.8; font-size: 12px; }
    #banner { position: fixed; left: 50%; top: 38%; transform: translateX(-50%);
              color: #fff; font: 700 56px system-ui; display: none; z-index: 20;
              text-shadow: 0 2px 16px rgba(0,0,0,0.8); }
    #legend { position: fixed; right: 12px; bottom: 12px; z-index: 10;
              padding: 9px 12px; border-radius: 7px;
              background: rgba(20,15,12,0.7); color: #d8cbbb;
              border: 1px solid rgba(255,178,77,0.15);
              font: 11px/1.7 system-ui, sans-serif; }
    #legend .sw { display: inline-block; width: 11px; height: 11px;
                  border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    #legend .row { white-space: nowrap; }

    /* 레벨 에디터 패널 */
    #editorPanel { position: fixed; right: 0; top: 0; bottom: 0; width: 280px; z-index: 15;
                   display: none; overflow-y: auto; padding: 12px 14px 40px;
                   background: rgba(16,12,9,0.92); color: #e7dccb;
                   border-left: 1px solid rgba(255,178,77,0.22);
                   font: 12px/1.4 system-ui, sans-serif; box-sizing: border-box; }
    #editorPanel .ed-sec { margin: 12px 0 5px; font-weight: 700; color: #ffd9a0;
                           letter-spacing: 0.3px; border-bottom: 1px solid rgba(255,178,77,0.15);
                           padding-bottom: 3px; }
    #editorPanel .ed-row { display: flex; align-items: center; gap: 5px; margin: 4px 0; flex-wrap: wrap; }
    #editorPanel .ed-lab { width: 64px; color: #b8a890; flex: none; }
    #editorPanel .ed-in { width: 56px; background: rgba(40,30,24,0.8); color: #ffe6c4;
                          border: 1px solid rgba(255,178,77,0.3); border-radius: 4px;
                          padding: 3px 5px; font: 12px system-ui; }
    #editorPanel input[type=text].ed-in { width: 120px; }
    #editorPanel select.ed-in { width: auto; }
    #editorPanel .ed-btn { background: rgba(40,30,24,0.8); color: #ffd9a0; cursor: pointer;
                           border: 1px solid rgba(255,178,77,0.35); border-radius: 4px;
                           padding: 4px 9px; font: 12px system-ui; }
    #editorPanel .ed-btn:hover { background: rgba(60,44,34,0.95); }
    #editorPanel .ed-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #editorPanel .ed-btn:disabled:hover { background: rgba(40,30,24,0.8); }
    #editorPanel .ed-draftnote { margin-top: 6px; font-size: 10px; color: #c9a98a; line-height: 1.4; }
    #editorPanel .ed-item { display: flex; gap: 4px; margin: 3px 0; }
    #editorPanel .ed-pick { flex: 1; text-align: left; background: rgba(40,30,24,0.7);
                            color: #e7dccb; cursor: pointer; border: 1px solid transparent;
                            border-radius: 4px; padding: 4px 7px; font: 12px system-ui; }
    #editorPanel .ed-item.ed-sel .ed-pick { border-color: #1f6feb; background: rgba(31,111,235,0.18); }
    #editorPanel .ed-tag { color: #9a8b78; font-size: 10px; }
    #editorPanel .ed-del { background: rgba(60,24,24,0.7); color: #f5a; cursor: pointer;
                           border: 1px solid rgba(255,90,90,0.3); border-radius: 4px; padding: 0 8px; }
    #editorPanel .ed-chk { color: #c8bba8; display: flex; align-items: center; gap: 3px; }
    #editorPanel .ed-rotsum { color: #9fd8ff; min-width: 56px; }
    #editorPanel .ed-status { margin-top: 10px; padding: 6px 8px; border-radius: 4px; font-size: 11px;
                              word-break: break-word; }
    #editorPanel .ed-status.ok { background: rgba(40,80,40,0.4); color: #9f9; }
    #editorPanel .ed-status.err { background: rgba(80,30,30,0.4); color: #f99; }

    /* 튜토리얼 가이드 카드 */
    #tutorial { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
                z-index: 30; display: none; width: min(600px, 88vw);
                padding: 22px 24px 18px; border-radius: 14px;
                background: rgba(22,16,12,0.97); color: #f0e6da;
                border: 1px solid rgba(255,178,77,0.45);
                box-shadow: 0 0 0 100vmax rgba(0,0,0,0.45), 0 12px 48px rgba(0,0,0,0.7);
                font: 16px/1.6 system-ui, sans-serif; }
    #tutorial .tut-step { color: #ffcf8a; font-size: 12px; font-weight: 700; letter-spacing: 0.4px; margin-bottom: 6px; }
    #tutorial .tut-body { margin-bottom: 12px; }
    #tutorial .tut-body b { color: #ffd9a0; }
    #tutorial .tut-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    #tutorial button { font: 13px system-ui; padding: 6px 16px; cursor: pointer;
                       background: rgba(255,178,77,0.16); color: #ffd9a0;
                       border: 1px solid rgba(255,178,77,0.5); border-radius: 6px; }
    #tutorial button:hover { background: rgba(255,178,77,0.28); }
    #tutorial .tut-skip { background: transparent; color: #9a8b78; border-color: transparent; }
    #tutorial .tut-skip:hover { color: #d8cbbb; background: transparent; }

    /* 메인(타이틀) 화면 */
    #mainScreen { position: fixed; inset: 0; z-index: 50; display: none;
                  flex-direction: column; align-items: center; justify-content: center;
                  background: radial-gradient(ellipse at 50% 38%, rgba(34,25,18,0.97), rgba(8,6,4,0.995));
                  color: #f0e6da; font-family: system-ui, sans-serif; }
    #mainScreen .ms-title { margin: 0; font-size: 64px; font-weight: 800; letter-spacing: 2px;
                            color: #ffd9a0; text-shadow: 0 6px 30px rgba(0,0,0,0.6); }
    #mainScreen .ms-sub { margin: 12px 0 40px; color: #c9b69c; font-size: 15px; }
    #mainScreen .ms-btns { display: flex; gap: 16px; }
    #mainScreen button { font: 600 18px system-ui; padding: 12px 34px; cursor: pointer;
                         background: rgba(255,178,77,0.16); color: #ffd9a0;
                         border: 1px solid rgba(255,178,77,0.5); border-radius: 9px; }
    #mainScreen button:hover { background: rgba(255,178,77,0.3); }
    #mainScreen #msEdit { background: rgba(80,120,160,0.14); color: #9fd8ff; border-color: rgba(120,180,230,0.45); }
    #mainScreen #msEdit:hover { background: rgba(80,120,160,0.28); }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/three-addons/"
  } }
  </script>
</head>
<body>
  <div id="ui">
    <button id="mainBtn" title="메인 화면으로 (Esc)">≡ 메인</button>
    <button id="go">Go</button>
    <button id="reset">Reset</button>
    <button id="hideObj" title="물체 본체를 숨겨 그림자(도로)만 미리봅니다 (단축키 h)">👁 물체 숨김</button>
    <button id="exportBtn" style="display:none">Export</button>
    <button id="prevLvl" title="이전 스테이지 (←)">◀</button>
    <span id="levelLabel"></span>
    <button id="nextLvl" title="다음 스테이지 (→)">▶</button>
    <span id="phase"></span>
    <span id="hint">drag: rotate obj · shift+drag: move · right-drag: orbit cam · wheel: zoom · space: Go/Test · r: reset · e: edit · h: 물체 숨김 · ←/→: 스테이지 · Esc: 메인</span>
  </div>
  <div id="stageTimer"></div>
  <div id="editorPanel"></div>
  <div id="tutorial">
    <div class="tut-step" id="tutStep"></div>
    <div class="tut-body" id="tutBody"></div>
    <div class="tut-actions">
      <button class="tut-skip" id="tutSkip">건너뛰기</button>
      <button id="tutNext">다음 ▶</button>
    </div>
  </div>
  <div id="legend">
    <span class="row"><span class="sw" style="background:#ffb24d"></span>movable · drag to rotate</span><br>
    <span class="row"><span class="sw" style="background:#6b7280"></span>fixed</span> &nbsp;
    <span class="row"><span class="sw" style="background:#ffe6b0"></span>road</span><br>
    <span class="row"><span class="sw" style="background:#33cc66"></span>start</span> &nbsp;
    <span class="row"><span class="sw" style="background:#ffcc33"></span>goal</span>
  </div>
  <div id="banner"></div>
  <div id="mainScreen">
    <h1 class="ms-title">ShadowDrive</h1>
    <p class="ms-sub">빛과 그림자로 길을 만들어 자동차를 목표까지 — Computer Graphics Term Project</p>
    <div class="ms-btns">
      <button id="msStart">▶ Start</button>
      <button id="msEdit">✎ 레벨 에디터</button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
